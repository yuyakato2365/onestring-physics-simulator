[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onestring-physics-simulator"
version = "0.1.0"
description = "A lightweight Python research prototype for quad-linkage design optimization and rope-driven physical deployment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OneString Physics Simulator Contributors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "plotly>=5.20",
  "streamlit>=1.34",
  "trimesh>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "imageio>=2.34",
  "kaleido>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
