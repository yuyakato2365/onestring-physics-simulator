name: Zhang 2021 source availability probe
on:
  workflow_dispatch:
  push:
    branches: [agent/zhang2021-independent-20261027]
    paths: [.github/workflows/zhang2021-reference-availability-probe-20261027.yml]
jobs:
  public-source-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check public authors' source links without authentication
        run: |
          set -euo pipefail
          for url in \
            'https://rec.ustc.edu.cn/share/8081ab10-dd29-11eb-b5e1-5fc36251b03b' \
            'https://rec.ustc.edu.cn/share/671127a0-dd29-11eb-8844-eff549b50054' \
            'https://rec.ustc.edu.cn/share/9d666eb0-dd29-11eb-b44e-f1734f8d7078' \
            'https://pan.ustc.edu.cn/' ; do
            printf '\n=== %s ===\n' "$url"
            curl -Ls --max-time 20 -D /tmp/zhang_headers.txt -o /tmp/zhang_body.txt \
              -w 'HTTP=%{http_code} type=%{content_type} bytes=%{size_download} redirect=%{url_effective}\n' \
              "$url" || true
            grep -iE '^HTTP/|^content-type:|^location:' /tmp/zhang_headers.txt | tail -10 || true
            head -c 160 /tmp/zhang_body.txt | tr '\n' ' ' || true
            printf '\n'
          done

      - name: Inspect public REC page script routes (diagnostic only)
        run: |
          set -euo pipefail
          curl -sSL --max-time 20 \
            'https://rec.ustc.edu.cn/share/8081ab10-dd29-11eb-b5e1-5fc36251b03b' \
            > /tmp/rec_share.html
          echo '=== script tags ==='
          grep -oE '<script[^>]*>' /tmp/rec_share.html | tail -12 || true
          echo '=== public JS file paths ==='
          grep -oE '(src=|href=)[^ >]+' /tmp/rec_share.html | grep -E 'js|css' | tail -20 || true
          echo '=== REC file title / shutdown markup ==='
          grep -oE '.{0,40}(停止服务|2026年8月6日|Code|download).{0,100}' /tmp/rec_share.html | head -12 || true

      - name: Identify public guest-share API from static JS bundles
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin
          origin="https://rec.ustc.edu.cn"
          html=urllib.request.urlopen(origin+"/share/8081ab10-dd29-11eb-b5e1-5fc36251b03b",timeout=20).read().decode()
          script_paths=re.findall(r'<script\s+src=([^ >]+)',html)
          script_paths += ["/js/chunk-common.646a2039.js", "/js/main.f3e80b7c.js"]
          print("=== candidate API tokens from public bundles ===")
          for p in list(dict.fromkeys(script_paths)):
              try:
                  raw=urllib.request.urlopen(urljoin(origin,p),timeout=30).read()
                  data=raw.decode("utf-8",errors="replace")
              except Exception as e:
                  print("skip",p,type(e).__name__)
                  continue
              patterns=['/api/','share/','shareInfo','shareLink','download','getShare',
                        'fileShare','shareId','share_id']
              matches=[]
              for pattern in patterns:
                  spots=[m.start() for m in re.finditer(re.escape(pattern),data,re.I)]
                  for pos in spots[:3]:
                      snippet=data[max(0,pos-100):min(len(data),pos+120)]
                      snippet=snippet.encode('unicode_escape').decode('ascii')
                      matches.append((pattern,snippet))
              print("SCRIPT",p,"SIZE",len(raw),"MARKERS",len(matches))
              for x in matches[:18]:
                  print(x)
          PY

      - name: Inspect guest-share Vue route bundle endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          base="https://rec.ustc.edu.cn"
          html=urllib.request.urlopen(base+"/share/8081ab10-dd29-11eb-b5e1-5fc36251b03b",timeout=20).read().decode()
          hits=re.findall(r'/js/chunk-1fe9560c\\.[0-9a-f]+\\.js',html)
          print("guest-route-bundles",hits)
          for name in hits[:2]:
              blob=urllib.request.urlopen(base+name,timeout=30).read().decode(errors="replace")
              print("GUEST-BUNDLE-SIZE",len(blob))
              for pat in ['share_number','shareInfo','shareFile','axios','download','getshare','getShare','/api','/share','apiUrl']:
                  ps=[m.start() for m in re.finditer(re.escape(pat),blob,re.I)]
                  print("PATTERN",pat,"N",len(ps))
                  for pos in ps[:6]:
                      print(repr(blob[max(0,pos-190):min(len(blob),pos+230)]))
          PY

      - name: Recover guest-share endpoint names from publicly served Javascript
        run: |
          python3 - <<'PY'
          import re, urllib.request
          root="https://rec.ustc.edu.cn"
          for name in ["/js/runtime.4f1c887e.js","/js/chunk-common.646a2039.js"]:
              body=urllib.request.urlopen(root+name,timeout=40).read().decode(errors="replace")
              if "runtime" in name:
                  for m in list(re.finditer("1fe9560c",body))[:8]:
                      print("ROUTE-CHUNK",repr(body[max(0,m.start()-160):m.end()+210]))
              else:
                  matches=set(re.findall(r'url:"(/[a-zA-Z0-9/_?={}.+-]+)"',body))
                  for v in sorted(matches):
                      if any(k in v.lower() for k in ("share","download","public","file")):
                          print("SHARE-API-PATH",v)
          PY

      - name: Inspect authors-code guest share using official public legacy endpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,re
          root="https://rec.ustc.edu.cn"
          p="/js/chunk-1fe9560c.300096c9.js"
          raw=urllib.request.urlopen(root+p,timeout=30).read().decode(errors="replace")
          print("GUEST_ROUTER_JS",len(raw))
          for pattern in ("share_number","getShareInfo","getShareTargetInfo","target","download"):
              positions=[m.start() for m in re.finditer(re.escape(pattern),raw,re.I)]
              print("MATCHES",pattern,len(positions))
              for pos in positions[:4]:
                  print("CONTEXT",repr(raw[max(0,pos-190):min(len(raw),pos+270)]))
          share="8081ab10-dd29-11eb-b5e1-5fc36251b03b"
          base="https://recapi.ustc.edu.cn/api/v2"
          for path in ("/share/target/info","/share/target/resource/list"):
              for method in ("GET","POST"):
                  try:
                      url=base+path+("?share_number="+share if method=="GET" else "")
                      body=(json.dumps({"share_number":share}).encode() if method=="POST" else None)
                      headers={"Content-Type":"application/json","Origin":root}
                      req=urllib.request.Request(url,data=body,headers=headers,method=method)
                      response=urllib.request.urlopen(req,timeout=15)
                      sample=response.read(1500).decode(errors="replace")
                      print("REC_API",path,method,"HTTP",response.status,"BODY",sample)
                  except urllib.error.HTTPError as e:
                      print("REC_API",path,method,"HTTP",e.code,"BODY",e.read(500).decode(errors="replace"))
                  except Exception as e:
                      print("REC_API",path,method,"ERROR",type(e).__name__,str(e)[:160])
          PY

      - name: Fetch publicly shared author's Code_new.zip and inspect package without redistribution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,zipfile,os
          from pathlib import Path
          host="https://recapi.ustc.edu.cn/api/v2"
          payload={
              "share_number":"8081ab10-dd29-11eb-b5e1-5fc36251b03b",
              "share_constraint":{"password":None},
              "share_resources_list":["29b9f530-dd29-11eb-b95c-8d3989e040ed"],
          }
          req=urllib.request.Request(host+"/share/download",
              data=json.dumps(payload).encode(),
              headers={"Content-Type":"application/json","Origin":"https://rec.ustc.edu.cn"},
              method="POST")
          try:
              response=urllib.request.urlopen(req,timeout=30)
              data=json.loads(response.read().decode("utf-8-sig"))
              print("DOWNLOAD_API_STATUS",data.get("status_code"),data.get("message"))
              if data.get("status_code")!=200:
                  raise SystemExit("Reference source download API refused")
              urls=list(data.get("entity",{}).values())
              print("SIGNED_URL_RETURNED",bool(urls))
              if not urls:
                  raise SystemExit("No public signed link")
              link=urls[0]
              print("SIGNED_URL_HOST",urllib.request.urlparse(link).netloc if hasattr(urllib.request,"urlparse") else link.split("/")[2])
              out=Path("/tmp/zhang2021_Code_new.zip")
              urllib.request.urlretrieve(link,out)
              print("DOWNLOADED_BYTES",out.stat().st_size)
              with zipfile.ZipFile(out) as z:
                  names=z.namelist()
                  print("ARCHIVE_ENTRIES",len(names))
                  for x in names[:180]:
                      print("FILE",x)
                  for x in names:
                      base=x.rsplit("/",1)[-1].lower()
                      if base in ("readme","readme.md","readme.txt","license","license.txt","license.md","cmakelists.txt"):
                          print("TEXTFILE",x)
                          raw=z.read(x)
                          print(raw[:9000].decode("utf-8",errors="replace"))
          except Exception as e:
              print("DOWNLOAD_EXCEPTION",type(e).__name__,str(e)[:900])
              raise
          PY
