name: Experimental T2D flexure, AL and reflatten Split
on:
  push:
    branches: [feature/isogami-flexure-t2d-20261021, feature/normal-flow-reflatten-csf-20261023]
    paths:
      - "onestring-physics-simulator/src/onestring_physics/t2d_flexure_fabrication.py"
      - "onestring-physics-simulator/app_runtime_base.py"
      - "onestring-physics-simulator/app_optcuts_core_20260916.py"
      - "onestring-physics-simulator/tests/test_k3d_al_launcher_wiring.py"
      - "onestring-physics-simulator/tests/test_paper_split_reflatten.py"
      - "onestring-physics-simulator/tests/test_generic_reflatten_inputs.py"
      - "onestring-physics-simulator/scripts/run_reflatten_split.py"
      - "onestring-physics-simulator/src/onestring_physics/paper_split_reflatten.py"
      - "onestring-physics-simulator/src/onestring_physics/bff_rectangle_selection.py"
      - "onestring-physics-simulator/src/onestring_physics/reference_bff.py"
      - "onestring-physics-simulator/tests/test_bff_debug_capture.py"
      - "onestring-physics-simulator/tests/test_bff_free_boundary_recovery.py"
      - "onestring-physics-simulator/tests/test_reference_bff_similarity_invariance.py"
      - "onestring-physics-simulator/tests/test_bff_rectangle_selection.py"
      - "onestring-physics-simulator/tests/test_tutte_rectangle_rescue.py"
      - "onestring-physics-simulator/src/onestring_physics/tutte_rectangle_rescue.py"
      - "onestring-physics-simulator/src/onestring_physics/paper_mesh_splitting.py"
      - "onestring-physics-simulator/src/onestring_physics/reflatten_split_view.py"
      - "onestring-physics-simulator/src/onestring_physics/visualization.py"
      - "onestring-physics-simulator/tests/test_optcuts_seam_visualization.py"
      - "onestring-physics-simulator/src/onestring_physics/paper_ui_20260916_patch.py"
      - "onestring-physics-simulator/src/onestring_physics/onestring_pipeline.py"
      - "onestring-physics-simulator/tests/test_t2d_flexure_fabrication.py"
      - ".github/workflows/t2d-flexure-export.yml"
  workflow_dispatch:
jobs:
  flexure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Syntax checks
        run: python -m py_compile src/onestring_physics/t2d_flexure_fabrication.py app_runtime_base.py tests/test_t2d_flexure_fabrication.py tests/test_k3d_al_launcher_wiring.py tests/test_paper_split_reflatten.py app_optcuts_core_20260916.py src/onestring_physics/paper_split_reflatten.py src/onestring_physics/paper_mesh_splitting.py src/onestring_physics/onestring_pipeline.py src/onestring_physics/reflatten_split_view.py src/onestring_physics/visualization.py src/onestring_physics/paper_ui_20260916_patch.py scripts/run_reflatten_split.py tests/test_generic_reflatten_inputs.py src/onestring_physics/bff_rectangle_selection.py tests/test_bff_rectangle_selection.py tests/test_tutte_rectangle_rescue.py src/onestring_physics/tutte_rectangle_rescue.py src/onestring_physics/reference_bff.py tests/test_reference_bff_similarity_invariance.py tests/test_bff_debug_capture.py tests/test_bff_free_boundary_recovery.py
      - name: T2D fabrication and prior layout regressions
        run: python -m pytest -q tests/test_t2d_flexure_fabrication.py tests/test_paper_t2d.py tests/test_t2d_pipeline_ui_wiring.py tests/test_k3d_al_launcher_wiring.py tests/test_paper_split_reflatten.py tests/test_optcuts_seam_visualization.py tests/test_generic_reflatten_inputs.py tests/test_bff_rectangle_selection.py tests/test_tutte_rectangle_rescue.py tests/test_reference_bff_similarity_invariance.py tests/test_bff_debug_capture.py tests/test_bff_free_boundary_recovery.py
