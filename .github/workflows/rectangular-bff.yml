name: Rectangular Boundary First Flattening
on:
  push:
    branches: [agent/paper-rectangular-bff-20261013, agent/paper-split-area-verified-20261014, feature/isogami-flexure-t2d-20261021]
    paths:
      - "onestring-physics-simulator/tools/bff_rectangle/**"
      - "onestring-physics-simulator/scripts/setup_bff_rectangle.py"
      - "onestring-physics-simulator/scripts/verify_rectangular_bff.py"
      - "onestring-physics-simulator/src/onestring_physics/reference_bff.py"
      - "onestring-physics-simulator/src/onestring_physics/onestring_pipeline.py"
      - "onestring-physics-simulator/src/onestring_physics/paper_fidelity_mode.py"
      - "onestring-physics-simulator/app_runtime_base.py"
      - "onestring-physics-simulator/app_optcuts_20260923_extrusion_aware.py"
      - "onestring-physics-simulator/src/onestring_physics/split_process_view.py"
      - "onestring-physics-simulator/tests/test_split_process_view_pandas.py"
      - "onestring-physics-simulator/tests/test_split_previous_acceptance.py"
      - "onestring-physics-simulator/src/onestring_physics/paper_mesh_splitting.py"
      - "onestring-physics-simulator/tests/test_k3d_edge_outlier_guard.py"
      - "onestring-physics-simulator/pyproject.toml"
      - "onestring-physics-simulator/tests/test_rectangular_bff.py"
      - "onestring-physics-simulator/tests/test_official_bff_provenance.py"
      - "onestring-physics-simulator/tests/test_paper_fidelity_computation_mode.py"
      - "onestring-physics-simulator/tests/test_paper_split_area_bound.py"
      - "onestring-physics-simulator/scripts/verify_lilium_paper_split.py"
      - ".github/workflows/rectangular-bff.yml"
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: UI dependency smoke test
        run: python -c "from streamlit_plotly_events import plotly_events; print('streamlit_plotly_events import OK')"
      - name: Syntax
        run: |
          python -m py_compile \
            src/onestring_physics/reference_bff.py \
            src/onestring_physics/onestring_pipeline.py \
            src/onestring_physics/paper_fidelity_mode.py \
            scripts/setup_bff_rectangle.py \
            scripts/verify_rectangular_bff.py \
            scripts/verify_lilium_paper_split.py \
            app_runtime_base.py
      - name: Rectangular BFF and pipeline regressions
        run: |
          python -m pytest -q \
            tests/test_rectangular_bff.py \
            tests/test_official_bff_provenance.py \
            tests/test_k3d_edge_outlier_guard.py \
            tests/test_split_process_view_pandas.py \
            tests/test_split_previous_acceptance.py \
            tests/test_paper_fidelity_computation_mode.py \
            tests/test_paper_split_area_bound.py \
            tests/test_paper_pd_deployment.py
  compile-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native BFF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libsuitesparse-dev libopenblas-dev liblapack-dev
      - name: Get official BFF source (not a fork)
        run: git clone --depth 1 --recursive https://github.com/GeometryCollective/boundary-first-flattening.git /tmp/official-bff
      - name: Compile rectangular CLI against official BFF library
        run: python scripts/setup_bff_rectangle.py --source /tmp/official-bff --jobs 4
      - name: Verify computed rectangle geometrically
        run: |
          python -m pip install -e .
          python scripts/verify_rectangular_bff.py
