name: Test genuine Zhang Segment with deterministic single-thread runtime
on:
  push:
    branches: [agent/zhang2021-independent-20261027]
    paths: [.github/workflows/zhang2021-native-segment-singlethread-20261027.yml]
  workflow_dispatch:
jobs:
  segment-original:
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original author executables and matching Qt
        run: |
          python scripts/download_zhang2021_executables.py --directory "$env:RUNNER_TEMP\zhang_singlethread"
          python scripts/install_zhang2021_qt_platform.py --exe-root "$env:RUNNER_TEMP\zhang_singlethread\authors_executables\ExeProgram"
      - name: Run authors untouched Straighten and Segment with one OpenMP worker
        run: |
          $root="$env:RUNNER_TEMP\zhang_singlethread\authors_executables\ExeProgram"
          Push-Location $root
          New-Item -ItemType Directory -Force -Path 'Source\before','Source\after','Result\finalOut' | Out-Null
          $env:QT_QPA_PLATFORM='offscreen'
          $env:OMP_NUM_THREADS='1'
          $env:MKL_NUM_THREADS='1'
          $env:KMP_NUM_THREADS='1'
          $name='model_15'
          $p=Start-Process -FilePath (Join-Path $root 'Straighten.exe') -ArgumentList @("Source/Input/$name.obj","Source/before/$name.obj","Source/after/${name}_axis.obj") -PassThru -NoNewWindow
          if(!$p.WaitForExit(60000)){$p.Kill();throw 'Author Straighten timeout'}
          Write-Output "SINGLE_STRAIGHTEN_EXIT $($p.ExitCode)"
          if(!(Test-Path "Source/after/${name}_axis.obj")){throw 'Author Straighten failed'}
          $p=Start-Process -FilePath (Join-Path $root 'Segment.exe') -ArgumentList @("Source/after/${name}_axis.obj","Result/","Source/before/$name.obj",'4000','0.01') -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $root 'segment.stdout') -RedirectStandardError (Join-Path $root 'segment.stderr')
          if(!$p.WaitForExit(70000)){$p.Kill();$p.WaitForExit();Write-Output "SINGLE_SEGMENT_TIMEOUT"}
          else{Write-Output "SINGLE_SEGMENT_EXIT $($p.ExitCode) HEX=$('{0:X8}' -f ($p.ExitCode -band 0xffffffff))"}
          if(Test-Path 'segment.stdout'){Get-Content 'segment.stdout' -Tail 40}
          if(Test-Path 'segment.stderr'){Get-Content 'segment.stderr' -Tail 40}
          Get-ChildItem 'Result' -File -ErrorAction SilentlyContinue | ForEach-Object {Write-Output "SINGLE_SEGMENT_RESULT $($_.Name) $($_.Length)"}
          Pop-Location
