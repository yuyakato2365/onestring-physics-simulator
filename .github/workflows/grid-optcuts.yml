name: Grid OptCuts validation

on:
  push:
    branches: [agent/large-steps-mesh-conditioning]
    paths:
      - "onestring-physics-simulator/scripts/patch_optcuts_native_grid*.py"
      - "onestring-physics-simulator/scripts/patch_optcuts_grid_v4.py"
      - "onestring-physics-simulator/scripts/setup_optcuts.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_*.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_uv_overlap_guard.py"
      - "onestring-physics-simulator/tests/test_optcuts_grid_*.py"
      - "onestring-physics-simulator/tests/test_optcuts_backend.py"
      - "onestring-physics-simulator/app_optcuts.py"
      - ".github/workflows/grid-optcuts.yml"
  pull_request:
    paths:
      - "onestring-physics-simulator/scripts/patch_optcuts_native_grid*.py"
      - "onestring-physics-simulator/scripts/patch_optcuts_grid_v4.py"
      - "onestring-physics-simulator/scripts/setup_optcuts.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_*.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_uv_overlap_guard.py"
      - "onestring-physics-simulator/tests/test_optcuts_grid_*.py"
      - "onestring-physics-simulator/tests/test_optcuts_backend.py"
      - "onestring-physics-simulator/app_optcuts.py"
      - ".github/workflows/grid-optcuts.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libpng-dev
          python -m pip install --upgrade pip -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile \
            scripts/patch_optcuts_native_grid.py \
            scripts/patch_optcuts_native_grid_v4.py \
            scripts/patch_optcuts_native_grid_v4_final.py \
            scripts/patch_optcuts_native_grid_v4_perf.py \
            scripts/patch_optcuts_grid_v4.py \
            scripts/setup_optcuts.py \
            src/onestring_physics/optcuts_grid_native_backend.py \
            src/onestring_physics/optcuts_grid_native_pipeline_patch.py \
            src/onestring_physics/optcuts_grid_native_lift_patch.py \
            src/onestring_physics/optcuts_grid_constrained_m2d_patch.py \
            src/onestring_physics/optcuts_grid_orientation_patch.py \
            src/onestring_physics/optcuts_grid_seam_sidecar_patch.py

      - name: Patch and build official OptCuts
        run: python scripts/setup_optcuts.py --jobs 2

      - name: Verify native source contract
        run: |
          grep -q "ONESTRING_GRID_NATIVE_V4" third_party/OptCuts/src/TriMesh.cpp
          grep -q "ONESTRING_GRID_NATIVE_V4_FAST_SEARCH" third_party/OptCuts/src/TriMesh.cpp
          grep -q "oneStringGridLockedVert" third_party/OptCuts/src/TriMesh.hpp
          grep -q "ONESTRING_GRID_NATIVE_V4_SEAM_SIDECAR" third_party/OptCuts/src/main.cpp
          grep -q "ONESTRING_GRID_NATIVE_V4_HARD_LOCK_STEP_FORWARD" third_party/OptCuts/src/Optimizer.cpp
          test -x third_party/OptCuts/build/OptCuts_bin

      - name: Initial Grid seam smoke
        shell: bash
        run: |
          cat > /tmp/grid_tetra.obj <<'OBJ'
          v 1 1 1
          v -1 -1 1
          v -1 1 -1
          v 1 -1 -1
          f 1 2 3
          f 1 4 2
          f 1 3 4
          f 2 4 3
          OBJ
          export ONESTRING_OPTCUTS_GRID_NATIVE=1 ONESTRING_OPTCUTS_GRID_H=0.5
          export ONESTRING_OPTCUTS_GRID_ANGLE_RAD=0 ONESTRING_OPTCUTS_GRID_PHASE_U=0 ONESTRING_OPTCUTS_GRID_PHASE_V=0
          export ONESTRING_OPTCUTS_GRID_MAX_SNAP_STEPS=4 ONESTRING_OPTCUTS_GRID_TARGETS_PER_VERTEX=8 ONESTRING_OPTCUTS_GRID_MAX_EXACT_TRIALS=8
          timeout 120 ./third_party/OptCuts/build/OptCuts_bin 100 /tmp/grid_tetra.obj 0.999 1 0 1000 1 0 grid-init > /tmp/grid-init.log 2>&1 || { cat /tmp/grid-init.log; exit 1; }
          cat /tmp/grid-init.log
          grep -q "global_bijectivity_scaffold=enabled" /tmp/grid-init.log
          grep -q "final_seam_sidecar=" /tmp/grid-init.log
          grep -q "optimization converged" /tmp/grid-init.log

      - name: Find and validate one actually accepted Grid split
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np, trimesh
          for subdivision in (0, 1):
              base = trimesh.creation.icosphere(subdivisions=subdivision, radius=1.0)
              for stretch in (2.0, 3.0, 5.0, 8.0):
                  v = np.asarray(base.vertices).copy()
                  v[:, 2] *= stretch
                  trimesh.Trimesh(vertices=v, faces=base.faces, process=False).export(
                      f'/tmp/grid_candidate_s{subdivision}_z{stretch:g}.obj')
          PY
          export ONESTRING_OPTCUTS_GRID_NATIVE=1
          export ONESTRING_OPTCUTS_GRID_ANGLE_RAD=0 ONESTRING_OPTCUTS_GRID_PHASE_U=0 ONESTRING_OPTCUTS_GRID_PHASE_V=0
          export ONESTRING_OPTCUTS_GRID_TARGETS_PER_VERTEX=12 ONESTRING_OPTCUTS_GRID_MAX_EXACT_TRIALS=12
          accepted=0
          for mesh in /tmp/grid_candidate_*.obj; do
            for h in 0.08 0.10 0.15 0.20 0.30; do
              for snap in 4 8 12 20; do
                export ONESTRING_OPTCUTS_GRID_H="$h" ONESTRING_OPTCUTS_GRID_MAX_SNAP_STEPS="$snap"
                tag="accepted-$(basename "$mesh" .obj)-h${h}-s${snap}"
                log="/tmp/${tag}.log"
                if timeout 30 ./third_party/OptCuts/build/OptCuts_bin 100 "$mesh" 0.001 3 0 4.01 1 0 "$tag" > "$log" 2>&1; then
                  if grep -Eq "boundary split E_dec =|interior split E_dec =" "$log" && grep -q "final_seam_sidecar=" "$log"; then
                    echo "ACCEPTED GRID SPLIT FIXTURE: mesh=$mesh h=$h snap=$snap"
                    cat "$log"
                    accepted=1
                    break 3
                  fi
                elif grep -q "ONESTRING_GRID_FINAL_COHESIVE_SEAM_OFF_LATTICE" "$log"; then
                  echo "A cut was accepted but its final cohesive seam left the Grid:"
                  cat "$log"
                  exit 1
                fi
              done
            done
          done
          if [ "$accepted" -ne 1 ]; then
            echo "No deterministic accepted Grid split was found in the bounded fixture sweep."
            for log in /tmp/accepted-*.log; do tail -n 15 "$log" 2>/dev/null || true; done
            exit 1
          fi

      - name: Run Grid-OptCuts Python tests
        env:
          PYTHONPATH: src
          ONESTRING_OPTCUTS_EXECUTABLE: third_party/OptCuts/build/OptCuts_bin
          ONESTRING_OPTCUTS_GRID_TARGETS_PER_VERTEX: "8"
          ONESTRING_OPTCUTS_GRID_MAX_EXACT_TRIALS: "8"
        run: |
          python -m pytest \
            tests/test_optcuts_grid_native.py \
            tests/test_optcuts_grid_orientation_patch.py \
            tests/test_optcuts_grid_seam_sidecar_patch.py \
            tests/test_optcuts_backend.py -q
