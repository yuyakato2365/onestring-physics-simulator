name: Grid OptCuts validation

on:
  push:
    branches:
      - agent/large-steps-mesh-conditioning
    paths:
      - "onestring-physics-simulator/scripts/patch_optcuts_native_grid*.py"
      - "onestring-physics-simulator/scripts/setup_optcuts.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_*.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_uv_overlap_guard.py"
      - "onestring-physics-simulator/tests/test_optcuts_grid_native.py"
      - "onestring-physics-simulator/app_optcuts.py"
      - ".github/workflows/grid-optcuts.yml"
  pull_request:
    paths:
      - "onestring-physics-simulator/scripts/patch_optcuts_native_grid*.py"
      - "onestring-physics-simulator/scripts/setup_optcuts.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_*.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_uv_overlap_guard.py"
      - "onestring-physics-simulator/tests/test_optcuts_grid_native.py"
      - "onestring-physics-simulator/app_optcuts.py"
      - ".github/workflows/grid-optcuts.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libpng-dev

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile \
            scripts/patch_optcuts_native_grid.py \
            scripts/patch_optcuts_native_grid_v4.py \
            scripts/patch_optcuts_native_grid_v4_final.py \
            scripts/patch_optcuts_native_grid_v4_perf.py \
            scripts/setup_optcuts.py \
            src/onestring_physics/optcuts_grid_native_backend.py \
            src/onestring_physics/optcuts_grid_native_pipeline_patch.py \
            src/onestring_physics/optcuts_grid_native_lift_patch.py \
            src/onestring_physics/optcuts_grid_constrained_m2d_patch.py

      - name: Patch and build official OptCuts
        run: python scripts/setup_optcuts.py --jobs 2

      - name: Verify native V4 source markers
        run: |
          grep -q "ONESTRING_GRID_NATIVE_V4" third_party/OptCuts/src/TriMesh.cpp
          grep -q "ONESTRING_GRID_NATIVE_V4_FAST_SEARCH" third_party/OptCuts/src/TriMesh.cpp
          grep -q "oneStringGridLockedVert" third_party/OptCuts/src/TriMesh.hpp
          grep -q "native_candidate_search enabled version=4" third_party/OptCuts/src/main.cpp
          test -x third_party/OptCuts/build/OptCuts_bin

      - name: Native Grid-OptCuts initialization smoke test
        shell: bash
        run: |
          cat > /tmp/onestring_grid_smoke.obj <<'OBJ'
          v 1 1 1
          v -1 -1 1
          v -1 1 -1
          v 1 -1 -1
          f 1 2 3
          f 1 4 2
          f 1 3 4
          f 2 4 3
          OBJ
          export ONESTRING_OPTCUTS_GRID_NATIVE=1
          export ONESTRING_OPTCUTS_GRID_H=0.5
          export ONESTRING_OPTCUTS_GRID_ANGLE_RAD=0
          export ONESTRING_OPTCUTS_GRID_PHASE_U=0
          export ONESTRING_OPTCUTS_GRID_PHASE_V=0
          export ONESTRING_OPTCUTS_GRID_MAX_SNAP_STEPS=4
          export ONESTRING_OPTCUTS_GRID_TARGETS_PER_VERTEX=4
          export ONESTRING_OPTCUTS_GRID_MAX_EXACT_TRIALS=4
          timeout 120 ./third_party/OptCuts/build/OptCuts_bin \
            100 /tmp/onestring_grid_smoke.obj 0.999 1 0 1000 0 0 native-grid-init-smoke \
            > /tmp/native-grid-init-smoke.log 2>&1
          cat /tmp/native-grid-init-smoke.log
          grep -q "\[ONESTRING-GRID\] native_candidate_search enabled version=4" /tmp/native-grid-init-smoke.log
          grep -q "optimization converged" /tmp/native-grid-init-smoke.log

      - name: Native Grid-OptCuts split-search smoke test
        shell: bash
        run: |
          export ONESTRING_OPTCUTS_GRID_NATIVE=1
          export ONESTRING_OPTCUTS_GRID_H=0.5
          export ONESTRING_OPTCUTS_GRID_ANGLE_RAD=0
          export ONESTRING_OPTCUTS_GRID_PHASE_U=0
          export ONESTRING_OPTCUTS_GRID_PHASE_V=0
          export ONESTRING_OPTCUTS_GRID_MAX_SNAP_STEPS=4
          export ONESTRING_OPTCUTS_GRID_TARGETS_PER_VERTEX=4
          export ONESTRING_OPTCUTS_GRID_MAX_EXACT_TRIALS=4
          timeout 120 ./third_party/OptCuts/build/OptCuts_bin \
            100 /tmp/onestring_grid_smoke.obj 0.999 2 0 4.1 0 0 native-grid-split-smoke \
            > /tmp/native-grid-split-smoke.log 2>&1
          cat /tmp/native-grid-split-smoke.log
          grep -q "\[ONESTRING-GRID\] native_candidate_search enabled version=4" /tmp/native-grid-split-smoke.log
          grep -q "evaluate vertex splits" /tmp/native-grid-split-smoke.log

      - name: Native Grid-OptCuts accepts a real Grid split
        shell: bash
        run: |
          python - <<'PY'
          import trimesh
          mesh = trimesh.creation.icosphere(subdivisions=1, radius=1.0)
          mesh.export('/tmp/onestring_grid_icosphere.obj')
          print(f'icosphere vertices={len(mesh.vertices)} faces={len(mesh.faces)}')
          PY
          export ONESTRING_OPTCUTS_GRID_NATIVE=1
          export ONESTRING_OPTCUTS_GRID_H=0.10
          export ONESTRING_OPTCUTS_GRID_ANGLE_RAD=0
          export ONESTRING_OPTCUTS_GRID_PHASE_U=0
          export ONESTRING_OPTCUTS_GRID_PHASE_V=0
          export ONESTRING_OPTCUTS_GRID_MAX_SNAP_STEPS=8
          export ONESTRING_OPTCUTS_GRID_TARGETS_PER_VERTEX=4
          export ONESTRING_OPTCUTS_GRID_MAX_EXACT_TRIALS=6
          timeout 90 ./third_party/OptCuts/build/OptCuts_bin \
            100 /tmp/onestring_grid_icosphere.obj 0.01 3 0 4.1 0 0 native-grid-accepted-split \
            > /tmp/native-grid-accepted-split.log 2>&1
          cat /tmp/native-grid-accepted-split.log
          grep -q "\[ONESTRING-GRID\] native_candidate_search enabled version=4" /tmp/native-grid-accepted-split.log
          grep -Eq "boundary split E_dec =|interior split E_dec =" /tmp/native-grid-accepted-split.log

      - name: Run Grid-OptCuts unit and end-to-end tests
        env:
          PYTHONPATH: src
          ONESTRING_OPTCUTS_EXECUTABLE: third_party/OptCuts/build/OptCuts_bin
          ONESTRING_OPTCUTS_GRID_TARGETS_PER_VERTEX: "4"
          ONESTRING_OPTCUTS_GRID_MAX_EXACT_TRIALS: "4"
        run: python -m pytest tests/test_optcuts_grid_native.py tests/test_optcuts_backend.py -q
