name: OneString complete Lilium geometry grid14 S-to-T3D and T2D
on:
  push:
    branches: [agent/paper-split-area-verified-20261014]
    paths:
      - "onestring-physics-simulator/scripts/run_paper_full_pipeline.py"
      - ".github/workflows/onestring-paper-full-geometry-lilium.yml"
  workflow_dispatch:
jobs:
  actual-full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Native deps for official BFF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake build-essential libsuitesparse-dev libopenblas-dev liblapack-dev
      - name: Build real official rectangle-BFF backend
        run: |
          git clone --depth 1 --recursive https://github.com/GeometryCollective/boundary-first-flattening.git /tmp/official-bff
          python scripts/setup_bff_rectangle.py --source /tmp/official-bff --jobs 4
      - run: python -m pip install -e ".[dev]"
      - name: Acquire original user-matching Lilium mesh
        run: |
          curl -fL --retry 3 -o /tmp/lilium.obj https://raw.githubusercontent.com/libigl/libigl-tutorial-data/master/lilium.obj
          python - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path("/tmp/lilium.obj").read_bytes()).hexdigest()=="4f62ff741b41bd629ccbeaeb0bb2e44ac060cdff88f090129911bede790e8ab3"
          PY
      - name: Run actual full S to M2D M3D K3D T3D K2D T2D
        run: |
          python scripts/run_paper_full_pipeline.py /tmp/lilium.obj \
            --grid 14 --corner-selection min_whole_source_area_span_4phase \
            --max-3d-iterations 10 --max-2d-iterations 10 \
            --output output/lilium_full_geometry_grid14
      - name: Upload actual stage geometry and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onestring-Lilium-grid14-full-stage-geometry
          path: |
            onestring-physics-simulator/output/lilium_full_geometry_grid14/
          if-no-files-found: warn
