name: Collision Split lookahead regression

on:
  push:
    branches: [agent/collision-split-two-cut-lookahead-20261013]
    paths:
      - "onestring-physics-simulator/src/onestring_physics/paper_collision_split_lookahead.py"
      - "onestring-physics-simulator/src/onestring_physics/onestring_pipeline.py"
      - "onestring-physics-simulator/src/onestring_physics/paper_collision_split_preview_view.py"
      - "onestring-physics-simulator/tests/test_collision_split_lookahead.py"
      - "onestring-physics-simulator/tests/test_collision_split_preview.py"
      - "onestring-physics-simulator/tests/test_ui_result_recovery.py"
      - "onestring-physics-simulator/app_runtime_base.py"
      - ".github/workflows/collision-split-lookahead.yml"
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python syntax
        run: |
          python -m py_compile \
            src/onestring_physics/paper_collision_split_lookahead.py \
            src/onestring_physics/onestring_pipeline.py \
            src/onestring_physics/paper_collision_split_preview_view.py \
            app_runtime_base.py \
            tests/test_collision_split_lookahead.py
      - name: Run targeted regression tests
        run: python -m pytest -q tests/test_collision_split_lookahead.py tests/test_collision_split_preview.py tests/test_ui_result_recovery.py
