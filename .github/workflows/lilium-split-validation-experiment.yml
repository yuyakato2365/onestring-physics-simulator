name: Independent Lilium Split validation experiment

on:
  push:
    branches:
      - research/lilium-split-validation-20261019
    paths:
      - "onestring-physics-simulator/src/onestring_physics/split_validation/**"
      - "onestring-physics-simulator/scripts/validate_lilium_split.py"
      - "onestring-physics-simulator/tests/test_split_validation_independent.py"
      - ".github/workflows/lilium-split-validation-experiment.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python and native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake build-essential libsuitesparse-dev libopenblas-dev liblapack-dev
          python -m pip install -e ".[dev]"
      - name: Run purely mathematical tests first
        run: python -m pytest -q tests/test_split_validation_independent.py
      - name: Download exact Lilium OBJ
        run: |
          curl -fL --retry 3 -o /tmp/lilium.obj https://raw.githubusercontent.com/libigl/libigl-tutorial-data/master/lilium.obj
          python - <<'PY'
          from pathlib import Path
          import hashlib
          got=hashlib.sha256(Path('/tmp/lilium.obj').read_bytes()).hexdigest()
          assert got == "4f62ff741b41bd629ccbeaeb0bb2e44ac060cdff88f090129911bede790e8ab3", got
          print("Lilium input SHA verified",got)
          PY
      - name: Build official free and rectangular BFF
        run: |
          git clone --depth 1 --recursive https://github.com/GeometryCollective/boundary-first-flattening.git /tmp/official-bff
          python scripts/setup_bff_rectangle.py --source /tmp/official-bff --jobs 4
          cmake -S /tmp/official-bff -B /tmp/official-bff-cli-build \
            -DBFF_BUILD_GUI=OFF -DBFF_BUILD_CLI=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DCMAKE_CXX_FLAGS=-include cstdint"
          cmake --build /tmp/official-bff-cli-build --target bff-command-line --parallel 4
      - name: Execute hypothesis and baseline-proxy comparison
        env:
          ONESTRING_BFF_EXECUTABLE: /tmp/official-bff-cli-build/bff-command-line
        run: |
          python scripts/validate_lilium_split.py /tmp/lilium.obj --require-lilium-sha \
            --grid 14 --cases B0,B6 --max-splits 3 \
            --output output/lilium_split_validation
      - name: Full 8-case ablation, 20-condition sensitivity, and tip perturbations
        env:
          ONESTRING_BFF_EXECUTABLE: /tmp/official-bff-cli-build/bff-command-line
        run: |
          python scripts/validate_lilium_split.py /tmp/lilium.obj --require-lilium-sha             --grid 14 --cases B0,B1,B2,B3,B4,B5,B6,B7             --max-splits 8 --sensitivity --corner-sensitivity             --output output/lilium_split_validation_full
      - name: Sweep all first-cut grid lines for B6
        env:
          ONESTRING_BFF_EXECUTABLE: /tmp/official-bff-cli-build/bff-command-line
        run: |
          python scripts/validate_lilium_split.py /tmp/lilium.obj --require-lilium-sha             --grid 14 --cases B6 --max-splits 1 --sweep             --output output/lilium_split_validation_cut_sweep
      - name: Upload actual diagnostics even on experimental failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-lilium-split-validation
          path: |
            onestring-physics-simulator/output/lilium_split_validation/
            onestring-physics-simulator/output/lilium_split_validation_full/
            onestring-physics-simulator/output/lilium_split_validation_cut_sweep/
          if-no-files-found: warn
