name: Native contact and T2D rigid reassembly regression
on:
  push:
    branches: [agent/native-contact-and-t2d-reassembly-20261013]
    paths:
      - "onestring-physics-simulator/src/onestring_physics/native_string_deployment.py"
      - "onestring-physics-simulator/src/onestring_physics/t2d_rigid_reassembly.py"
      - "onestring-physics-simulator/app_runtime_base.py"
      - "onestring-physics-simulator/tests/test_native_string_deployment.py"
      - "onestring-physics-simulator/tests/test_t2d_rigid_reassembly.py"
      - ".github/workflows/native-contact-reassembly.yml"
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Syntax
        run: |
          python -m py_compile \
            src/onestring_physics/native_string_deployment.py \
            src/onestring_physics/t2d_rigid_reassembly.py \
            app_runtime_base.py
      - name: Tests
        run: |
          python -m pytest -q \
            tests/test_t2d_rigid_reassembly.py \
            tests/test_native_string_deployment.py \
            tests/test_abd_backend.py \
            tests/test_fast_assembly_animation.py \
            tests/test_t2d_pipeline_ui_wiring.py
