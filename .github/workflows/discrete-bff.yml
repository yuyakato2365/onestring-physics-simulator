name: BFF and CEPS validation

on:
  push:
    branches:
      - codex/discrete-bff-rectangle
  pull_request:
    paths:
      - "onestring-physics-simulator/src/onestring_physics/discrete_bff.py"
      - "onestring-physics-simulator/src/onestring_physics/official_ceps.py"
      - "onestring-physics-simulator/src/onestring_physics/__init__.py"
      - "onestring-physics-simulator/tests/test_discrete_bff.py"
      - "onestring-physics-simulator/tests/test_official_ceps.py"
      - "onestring-physics-simulator/scripts/verify_discrete_bff.py"
      - "onestring-physics-simulator/scripts/verify_ceps_integration.py"
      - ".github/workflows/discrete-bff.yml"

jobs:
  test-parameterization-backends:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: onestring-physics-simulator/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy
      - name: Run BFF and CEPS bridge tests
        run: python -m pytest tests/test_discrete_bff.py tests/test_official_ceps.py -q
      - name: Run discrete BFF smoke verifier
        run: python scripts/verify_discrete_bff.py
      - name: Compile parameterization integration
        run: python -m py_compile src/onestring_physics/discrete_bff.py src/onestring_physics/official_ceps.py src/onestring_physics/__init__.py scripts/verify_discrete_bff.py scripts/verify_ceps_integration.py
