name: Find native original Segment fast-fail location
on:
  push:
    branches: [agent/zhang2021-independent-20261027]
    paths: [.github/workflows/zhang2021-segment-windows-eventlog-20261027.yml]
  workflow_dispatch:
jobs:
  native-original:
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        working-directory: onestring-physics-simulator
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch untouched 2021 original binaries and Qt 5.10
        run: |
          python scripts/download_zhang2021_executables.py --directory "$env:RUNNER_TEMP\zhang_native_crash"
          python scripts/install_zhang2021_qt_platform.py --exe-root "$env:RUNNER_TEMP\zhang_native_crash\authors_executables\ExeProgram"
      - name: Locate debugger and native executable's exact crashing module
        run: |
          $root="$env:RUNNER_TEMP\zhang_native_crash\authors_executables\ExeProgram"
          Write-Output '=== WINDOWS DEBUGGER AVAILABILITY ==='
          foreach($name in @('cdb.exe','windbg.exe','procdump.exe')){
            where.exe $name 2>&1 | Select-Object -First 3
          }
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Filter 'cdb.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Push-Location $root
          New-Item -ItemType Directory -Force -Path 'Source\before','Source\after','Result\finalOut' | Out-Null
          $env:QT_QPA_PLATFORM='offscreen'
          $a=Start-Process -FilePath (Join-Path $root 'Straighten.exe') -ArgumentList @('Source/Input/model_15.obj','Source/before/model_15.obj','Source/after/model_15_axis.obj') -PassThru -NoNewWindow
          if(!$a.WaitForExit(60000)){ $a.Kill(); throw "Straighten timeout" }
          if(!(Test-Path 'Source/after/model_15_axis.obj')){throw 'Straighten did not output'}
          $before=Get-Date
          $p=Start-Process -FilePath (Join-Path $root 'Segment.exe') -ArgumentList @('Source/after/model_15_axis.obj','Result/','Source/before/model_15.obj','35','0.01') -NoNewWindow -PassThru -RedirectStandardOutput (Join-Path $root 'segment.stdout') -RedirectStandardError (Join-Path $root 'segment.stderr')
          if(!$p.WaitForExit(60000)){ $p.Kill(); $p.WaitForExit(); Write-Output "SEGMENT_TIMED_OUT" }
          else{Write-Output "SEGMENT_CODE=$($p.ExitCode)"}
          Start-Sleep -Seconds 5
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$before.AddSeconds(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -like '*Segment.exe*' -or $_.ProviderName -like '*Windows Error Reporting*' } |
            Select-Object -First 12 | ForEach-Object {
              Write-Output "WINDOWS_EVENT_ID $($_.Id) $($_.ProviderName)"
              Write-Output "WINDOWS_EVENT_MSG $($_.Message.Substring(0,[Math]::Min(2600,$_.Message.Length)))"
            }
          Pop-Location
