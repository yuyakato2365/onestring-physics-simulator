name: OptCuts area-grid boundary regression

on:
  push:
    branches:
      - fix/optcuts-real-m2d-footprint-20261023
    paths:
      - "onestring-physics-simulator/src/onestring_physics/optcuts_area_grid_boundary.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_boundary_untangle.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_failure_diagnostics.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_ear_correspondence.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_aware_seam_selection.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_test_boundary_reparameterization_patch.py"
      - "onestring-physics-simulator/tests/test_optcuts_area_grid_boundary.py"
      - "onestring-physics-simulator/tests/test_optcuts_grid_failure_diagnostics.py"
      - "onestring-physics-simulator/scripts/summarize_grid_boundary_failures.py"
      - "onestring-physics-simulator/scripts/replay_grid_ear_correspondence.py"
      - ".github/workflows/optcuts-area-boundary-regression.yml"
  workflow_dispatch:

jobs:
  synthetic-geometry-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: python -m pip install -e ".[dev]"
      - name: Check syntax
        run: |
          python -m py_compile src/onestring_physics/optcuts_area_grid_boundary.py src/onestring_physics/optcuts_grid_boundary_untangle.py src/onestring_physics/optcuts_grid_failure_diagnostics.py src/onestring_physics/optcuts_grid_ear_correspondence.py src/onestring_physics/optcuts_grid_aware_seam_selection.py src/onestring_physics/optcuts_test_boundary_reparameterization_patch.py tests/test_optcuts_area_grid_boundary.py tests/test_optcuts_grid_failure_diagnostics.py scripts/summarize_grid_boundary_failures.py scripts/replay_grid_ear_correspondence.py
      - name: Test area-grid boundary and fixed-M2D invariants
        run: python -m pytest -q tests/test_optcuts_area_grid_boundary.py tests/test_optcuts_grid_failure_diagnostics.py
