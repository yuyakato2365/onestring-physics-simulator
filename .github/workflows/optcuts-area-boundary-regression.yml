name: OptCuts area-grid boundary regression

on:
  push:
    branches:
      - fix/optcuts-real-m2d-footprint-20261023
    paths:
      - "onestring-physics-simulator/src/onestring_physics/optcuts_area_grid_boundary.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_boundary_untangle.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_failure_diagnostics.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_ear_correspondence.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_sd_refinement.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_seam_exact_closure.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_seam_affine_constraints.py"
      - "onestring-physics-simulator/src/onestring_physics/extrusion_aware.py"
      - "onestring-physics-simulator/src/onestring_physics/split_geometry_constraints.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_test_k3d_augmented_lagrangian_patch.py"
      - "onestring-physics-simulator/src/onestring_physics/paper_extrusion.py"
      - "onestring-physics-simulator/app_optcuts_core_20260916.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_grid_aware_seam_selection.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_test_boundary_reparameterization_patch.py"
      - "onestring-physics-simulator/src/onestring_physics/optcuts_test_boundary_clip_m2d_patch.py"
      - "onestring-physics-simulator/tests/test_optcuts_area_grid_boundary.py"
      - "onestring-physics-simulator/tests/test_optcuts_area_grid_m2d_authoritative_mask.py"
      - "onestring-physics-simulator/tests/test_optcuts_grid_failure_diagnostics.py"
      - "onestring-physics-simulator/tests/test_optcuts_grid_sd_refinement.py"
      - "onestring-physics-simulator/tests/test_optcuts_seam_exact_closure.py"
      - "onestring-physics-simulator/tests/test_optcuts_seam_mixed_boundary_affine.py"
      - "onestring-physics-simulator/tests/test_optcuts_smoothmax_default_active.py"
      - "onestring-physics-simulator/scripts/summarize_grid_boundary_failures.py"
      - "onestring-physics-simulator/scripts/replay_grid_ear_correspondence.py"
      - ".github/workflows/optcuts-area-boundary-regression.yml"
  workflow_dispatch:

jobs:
  synthetic-geometry-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: python -m pip install -e ".[dev]"
      - name: Check syntax
        run: |
          python -m py_compile src/onestring_physics/optcuts_area_grid_boundary.py src/onestring_physics/optcuts_grid_boundary_untangle.py src/onestring_physics/optcuts_grid_failure_diagnostics.py src/onestring_physics/optcuts_grid_ear_correspondence.py src/onestring_physics/optcuts_grid_sd_refinement.py src/onestring_physics/optcuts_seam_exact_closure.py src/onestring_physics/optcuts_seam_affine_constraints.py src/onestring_physics/extrusion_aware.py src/onestring_physics/split_geometry_constraints.py src/onestring_physics/optcuts_test_k3d_augmented_lagrangian_patch.py src/onestring_physics/paper_extrusion.py src/onestring_physics/optcuts_grid_aware_seam_selection.py src/onestring_physics/optcuts_test_boundary_reparameterization_patch.py src/onestring_physics/optcuts_test_boundary_clip_m2d_patch.py tests/test_optcuts_area_grid_boundary.py tests/test_optcuts_area_grid_m2d_authoritative_mask.py tests/test_optcuts_grid_failure_diagnostics.py tests/test_optcuts_grid_sd_refinement.py tests/test_optcuts_seam_exact_closure.py tests/test_optcuts_seam_mixed_boundary_affine.py tests/test_optcuts_smoothmax_default_active.py scripts/summarize_grid_boundary_failures.py scripts/replay_grid_ear_correspondence.py
      - name: Test area-grid boundary and fixed-M2D invariants
        run: python -m pytest -q tests/test_optcuts_area_grid_boundary.py tests/test_optcuts_area_grid_m2d_authoritative_mask.py tests/test_optcuts_grid_failure_diagnostics.py tests/test_optcuts_grid_sd_refinement.py tests/test_optcuts_seam_exact_closure.py tests/test_optcuts_smoothmax_default_active.py tests/test_square_beta_zero.py tests/test_k3d_al_launcher_wiring.py tests/test_paper_t3d_20260920.py
