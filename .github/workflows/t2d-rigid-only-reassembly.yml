name: Rigid-only T2D reassembly verification
on:
  push:
    branches: [agent/t2d-rigid-only-reassembly-view-20261013]
    paths:
      - "onestring-physics-simulator/src/onestring_physics/t2d_rigid_reassembly.py"
      - "onestring-physics-simulator/app_runtime_base.py"
      - "onestring-physics-simulator/tests/test_t2d_rigid_reassembly.py"
      - ".github/workflows/t2d-rigid-only-reassembly.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Syntax checks
        run: |
          python -m py_compile \
            src/onestring_physics/t2d_rigid_reassembly.py \
            app_runtime_base.py
      - name: Rigid panel and animation regressions
        run: |
          python -m pytest -q \
            tests/test_t2d_rigid_reassembly.py \
            tests/test_native_string_deployment.py \
            tests/test_t2d_pipeline_ui_wiring.py
