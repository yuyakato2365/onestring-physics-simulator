name: Native longer settling animation regression
on:
  push:
    branches: [agent/native-longer-settling-20261013]
    paths:
      - "onestring-physics-simulator/src/onestring_physics/native_string_deployment.py"
      - "onestring-physics-simulator/src/onestring_physics/onestring_pipeline.py"
      - "onestring-physics-simulator/app_runtime_base.py"
      - "onestring-physics-simulator/tests/test_native_string_deployment.py"
      - ".github/workflows/native-longer-settling.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify syntax
        run: |
          python -m py_compile \
            src/onestring_physics/native_string_deployment.py \
            src/onestring_physics/onestring_pipeline.py \
            app_runtime_base.py \
            tests/test_native_string_deployment.py
      - name: Run physics, rendering and legacy regression
        run: |
          python -m pytest -q tests/test_native_string_deployment.py \
            tests/test_abd_backend.py \
            tests/test_fast_assembly_animation.py \
            tests/test_t2d_pipeline_ui_wiring.py
