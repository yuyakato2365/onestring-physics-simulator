name: Zhang 2021 isolated bridge audit

on:
  push:
    branches:
      - agent/zhang2021-independent-20261027
  workflow_dispatch:

jobs:
  zhang-adapter-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OneString test dependencies
        run: |
          python -m pip install -e . pytest shapely
      - name: Compile isolated reference bridge
        run: |
          python -m py_compile src/onestring_physics/zhang2021_reference_bridge.py
      - name: Test reference adapter and fail-closed audits
        run: |
          python -m pytest -q tests/test_zhang2021_reference_bridge.py
