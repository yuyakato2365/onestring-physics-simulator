name: Zhang 2021 isolated bridge audit

on:
  push:
    branches:
      - agent/zhang2021-independent-20261027
  workflow_dispatch:

jobs:
  zhang-adapter-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onestring-physics-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OneString test dependencies
        run: |
          python -m pip install -e . pytest 'shapely>=2.1'
      - name: Compile isolated reference bridge
        run: |
          python -m py_compile \
            src/onestring_physics/zhang2021_reference_bridge.py \
            src/onestring_physics/zhang2021_field_layout_experiment.py \
            src/onestring_physics/optcuts_planar_quad_20261026.py \
            src/onestring_physics/onestring_pipeline.py \
            scripts/zhang2021_authors_native_adapter.py \
            scripts/download_zhang2021_executables.py \
            app_optcuts_core_20260916.py app_runtime_base.py
      - name: Test reference adapter and fail-closed audits
        run: |
          python -m pytest -q tests/test_zhang2021_reference_bridge.py tests/test_zhang2021_field_layout_experiment.py tests/test_zhang2021_authors_native_adapter.py
